<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>Chat-Formular</title>
</head>
<body>
<!-- Nur für Netlify Forms: wird vom Chat (netlify/functions/chat.js) befüllt. -->
<form name="chat" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input name="topic">
  <input name="name">
  <input name="contact">
  <input name="lang">
  <textarea name="message"></textarea>
  <input name="page">
</form>
</body>
</html>
