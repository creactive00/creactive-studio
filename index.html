  <script>
  // Sprachwahl: 1) gespeicherte Wahl, 2) Browsersprache, 3) Albanisch
  (function () {
    var supported = ["sq","mk","de","en"], fallback = 'sq', pick = null;
    try { pick = localStorage.getItem('cs-lang'); } catch (e) {}
    if (supported.indexOf(pick) < 0) {
      pick = null;
      var list = navigator.languages || [navigator.language || ''];
      for (var i = 0; i < list.length && !pick; i++) {
        var c = String(list[i]).toLowerCase().slice(0, 2);
        if (c === 'al') c = 'sq';
        if (supported.indexOf(c) > -1) pick = c;
      }
    }
    location.replace((pick || fallback) + '/' + location.hash);
  })();
  </script>
